# StarSim Central Terminal — Nginx reverse proxy config
#
# USAGE:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g. terminal.starsim.app)
#   2. Copy this file to /etc/nginx/sites-available/starsim
#   3. Symlink:  ln -s /etc/nginx/sites-available/starsim /etc/nginx/sites-enabled/
#   4. Test:     nginx -t
#   5. Reload:   systemctl reload nginx
#   6. SSL:      certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP to HTTPS (uncomment after certbot runs)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for large save uploads
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }
}
